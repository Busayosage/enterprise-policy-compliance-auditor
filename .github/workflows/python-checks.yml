name: CI — Enterprise Policy Compliance Auditor

on:
  push:
    branches: [main, feature/agentic-rag-v4]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.11 — full offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Pre-download HuggingFace embedding model
        run: |
          python - <<'EOF'
          from sentence_transformers import SentenceTransformer
          print("Downloading sentence-transformers/all-MiniLM-L6-v2 ...")
          SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          print("Model ready.")
          EOF

      - name: Syntax check — application modules
        run: |
          python -m py_compile app.py main.py database.py snowflake_logger.py
          python -m py_compile agent/__init__.py agent/graph.py agent/llm.py agent/state.py
          echo "All syntax checks passed"

      - name: Verify required project files
        run: |
          for file in app.py main.py database.py requirements.txt README.md .env.example .gitignore; do
            if [ ! -f "$file" ]; then echo "MISSING: $file"; exit 1; fi
            echo "OK: $file"
          done
          for dir in agent/ tests/ evaluation/; do
            if [ ! -d "$dir" ]; then echo "MISSING dir: $dir"; exit 1; fi
            echo "OK: $dir"
          done

      - name: Generate test PDF fixtures
        run: python tests/fixtures/make_fixtures.py

      - name: Verify test collection
        run: |
          pytest tests/ --collect-only -q 2>&1 | tee collection-output.txt || true
          echo "--- Collection output (last 50 lines) ---"
          tail -50 collection-output.txt

      - name: Run complete offline test suite
        timeout-minutes: 20
        run: |
          set -o pipefail
          pytest tests/ \
            --timeout=300 \
            -v --tb=long \
            --continue-on-collection-errors \
            --junitxml=test-results.xml \
            2>&1 | tee pytest-output.txt

      - name: Show failed tests
        if: always()
        run: |
          echo "=== FAILED TESTS ==="
          grep -E "^FAILED|^ERROR" pytest-output.txt || echo "(no FAILED lines found)"
          echo "=== SUMMARY ==="
          tail -20 pytest-output.txt
        env:
          NVIDIA_API_KEY: ""
          SNOWFLAKE_ACCOUNT: ""
          SNOWFLAKE_USER: ""
          SNOWFLAKE_PASSWORD: ""
          SNOWFLAKE_WAREHOUSE: ""
          SNOWFLAKE_DATABASE: ""
          SNOWFLAKE_SCHEMA: ""
          SNOWFLAKE_ROLE: ""

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            collection-output.txt
            test-results.xml
          retention-days: 7
